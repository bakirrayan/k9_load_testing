[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "0.22"
k9-core = { path = "crates/k9-core" }
k9-http = { path = "crates/k9-http" }
k9-metrics = { path = "crates/k9-metrics" }
k9-output = { path = "crates/k9-output" }
k9-cli = { path = "crates/k9-cli" }
k9-grpc = { path = "crates/k9-grpc" }
k9-testserver = { path = "crates/k9-testserver" }
k9-tui = { path = "crates/k9-tui" }

axum = { version = "0.8", features = ["ws", "multipart"] }
bytes = "1.12"
brotli = "9"
flate2 = "1.1"
zstd = "0.14"
clap = { version = "4.6", features = ["derive", "env"] }
cookie_store = { version = "0.22", default-features = false }
hdrhistogram = { version = "7.6", default-features = false }
hickory-resolver = "0.26"
http = "1.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body = "1.0"
http-body-util = "0.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1.11", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
indexmap = { version = "2.14", features = ["serde"] }
fastrand = "2.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1.11"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rcgen = "0.14"
rlimit = "0.11"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2"
tokio-stream = "0.1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
# `ring` instead of the default aws-lc-rs: no cmake/NASM needed for CI wheels.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
snap = "1.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1"
url = "2.5"
webpki-roots = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
