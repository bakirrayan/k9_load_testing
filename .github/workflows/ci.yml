# Tests on Linux, macOS and Windows: on every push and pull request once the
# repository is public (its runners are free), and when started by hand
# (`gh workflow run ci.yml`) while it's private.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The local-IP tests send from 127.0.0.2-3: macOS only sets up
      # 127.0.0.1 on loopback.
      - name: Loopback aliases
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # The oldest Rust that builds K9: the `rust-version` in Cargo.toml.
  msrv:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: Rust (minimum version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  python:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The abi3 floor and the newest release.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # The local-IP tests send from 127.0.0.2-3: macOS only sets up
      # 127.0.0.1 on loopback.
      - name: Loopback aliases
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up
      - name: Build and test
        run: |
          uv sync
          uv run k9 version
          uv run pytest

